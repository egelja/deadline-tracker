name: Extract deadlines

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false

env:
  CHUNK_TOTAL: 4          # number of parallel runners (match matrix length)

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]   # length must equal CHUNK_TOTAL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - name: Extract chunk ${{ matrix.chunk }}
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_OUT: data/partials/chunk-${{ matrix.chunk }}.json
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run scripts/extract.py

      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.chunk }}
          path: data/partials/chunk-${{ matrix.chunk }}.json
          retention-days: 1

  merge:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          path: data/partials
          pattern: partial-*
          merge-multiple: true

      - name: Merge partials
        run: uv run scripts/merge.py

      - name: Diff and update changelog
        id: diff
        run: |
          msg=$(uv run scripts/diff.py)
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$msg" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            msg='${{ steps.diff.outputs.msg }}'
            if [ "$msg" = "NO_CHANGES" ] || [ -z "$msg" ]; then
              msg="Refresh deadlines (last_checked only)"
            fi
            git commit -m "$msg"
            git push
          fi
