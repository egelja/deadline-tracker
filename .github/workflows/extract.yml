name: Extract deadlines

on:
  schedule:
    # Daily at 08:00 UTC (~midnight Pacific, ~3am Eastern)
    - cron: "0 8 * * *"
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write   # to commit refreshed data
  models: read      # to call GitHub Models

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip

      - name: Install Python deps
        run: pip install httpx trafilatura pyyaml openai

      - name: Extract deadlines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/extract.py

      - name: Diff and update changelog
        id: diff
        run: |
          msg=$(python scripts/diff.py)
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$msg" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            msg='${{ steps.diff.outputs.msg }}'
            if [ "$msg" = "NO_CHANGES" ] || [ -z "$msg" ]; then
              msg="Refresh deadlines (last_checked only)"
            fi
            git commit -m "$msg"
            git push
          fi
