name: Extract deadlines

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false

env:
  CHUNK_TOTAL: 4          # number of parallel runners (match matrix length)
  LLM_MODEL: qwen2.5:7b-instruct-q4_K_M

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]   # length must equal CHUNK_TOTAL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip
      - run: pip install httpx trafilatura pyyaml openai

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.LLM_MODEL }}

      - name: Start Ollama + pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull "$LLM_MODEL"

      - name: Extract chunk ${{ matrix.chunk }}
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_OUT: data/partials/chunk-${{ matrix.chunk }}.json
        run: python scripts/extract.py

      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.chunk }}
          path: data/partials/chunk-${{ matrix.chunk }}.json
          retention-days: 1

  merge:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - uses: actions/download-artifact@v4
        with:
          path: data/partials
          pattern: partial-*
          merge-multiple: true

      - name: Merge partials
        run: python scripts/merge.py

      - name: Diff and update changelog
        id: diff
        run: |
          msg=$(python scripts/diff.py)
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$msg" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            msg='${{ steps.diff.outputs.msg }}'
            if [ "$msg" = "NO_CHANGES" ] || [ -z "$msg" ]; then
              msg="Refresh deadlines (last_checked only)"
            fi
            git commit -m "$msg"
            git push
          fi
